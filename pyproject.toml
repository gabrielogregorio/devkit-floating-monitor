[project]
name = "devkit-floating-monitor"
version = "1.0.0"
description = "CPU, RAM and GPU on a transparent line above everything, with a GNOME top bar icon: GTK 3 from the system, /proc, /sys and NVML, no extra packages"
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["floating_monitor", "i18n"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["floating_monitor", "i18n", "conftest"]

[tool.uv]
# "Virtual" project: not an installable package, only a script run with the system python3
# (PyGObject/GTK come from apt). uv manages the dev tools only. Bump explicitly with:
#   uv lock --upgrade-package <pkg>==<new-ver>
package = false
upgrade = false
