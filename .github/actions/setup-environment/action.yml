name: 'Setup Environment'
description: 'Installs PyGObject + GTK 3 from apt (the app uses the system python3) and creates the venv with the locked dev tools'
runs:
  using: 'composite'
  steps:
    - name: PyGObject and GTK 3 (apt, like on the desktop)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends python3-gi gir1.2-gtk-3.0 > /dev/null

    - name: Python venv (system python3 + gi, locked dev tools)
      shell: bash
      run: |
        python3 -m venv --system-site-packages .venv
        .venv/bin/pip install --quiet --upgrade pip
        .venv/bin/pip install --quiet -r requirements-dev.txt
        .venv/bin/python --version
        .venv/bin/python -c "import gi; gi.require_version('Gtk', '3.0'); print('PyGObject', gi.__version__)"
