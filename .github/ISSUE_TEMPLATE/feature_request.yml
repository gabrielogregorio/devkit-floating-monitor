name: Feature request
description: A new block on the line, a menu option or a different alert rule
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to see or do and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
      description: e.g. "network KB/s block", "limits editable from the menu", "click-through"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
